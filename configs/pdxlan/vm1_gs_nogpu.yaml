apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: norwood-test
  namespace: vms
spec:
  running: false
  template:
    metadata:
      labels:
        kubevirt.io/domain: norwood
      annotations:
        ovn.kubernetes.io/ip_address: 10.42.9.51
        ovn.kubernetes.io/mac_address: 00:00:00:53:6B:00 
        pdxlan-pvt-nad.pdxlan.ovn.kubernetes.io/ip_address: 172.16.13.128
        pdxlan-pvt-nad.pdxlan.ovn.kubernetes.io/mac_address: 00:00:00:53:6B:01
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
        k8s.v1.cni.cncf.io/networks: pdxlan/pdxlan-pvt-nad
        ovn.kubernetes.io/logical_switch: "net-public"
        pdxlan-pvt-nad.pdxlan.ovn.kubernetes.io/default_route: 'false'
    spec:
      domain:
        cpu:
          cores: 6
        resources:
          requests:
            memory: 24Gi
        devices:
          disks:
            - name: boot-iso
              cdrom:
                bus: sata
            - name: rootdisk
              disk:
                bus: virtio
            - name: datadisk
              disk:
                bus: virtio
            - name: virtio-driver
              cdrom:
                bus: sata    
          interfaces:
            - name: default
              bridge: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: boot-iso
          dataVolume:
            name: boot-iso
        - name: rootdisk
          persistentVolumeClaim:
            name: test-rootdisk
        - name: datadisk
          persistentVolumeClaim:
            claimName: Vm1-gameStorage
        - name: virtio-driver
          image: kubevirt/virtio-container-disk
          