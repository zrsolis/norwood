ovsOvn:
  ovnDirectory: /var/lib/ovn
  ovsDirectory: /var/lib/openvswitch
  ovsIpsecKeysDirectory: "/var/lib/ovs_ipsec_keys"
  disableModulesManagement: true
networking:
  networkType: vlan 
  excludeIps: "172.16.16.1..172.16.16.24"
  stack: "IPv4"
  vlan: 
    interfaceName: ens1f0np0
    id: 0
  pods:
    cidr:
      v4: "172.16.16.0/24"
    gateways:
      v4: "172.16.16.1"
pinger:
  targets:
    externalAddresses:
      v4: "172.16.16.1"
cni: 
  mountToolingDirectory: false
features:
  enableNetworkPolicies: false
