apiVersion: v1
kind: Namespace
metadata:
  name: vms
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: test-rootdisk
  namespace: vms
spec:
  source:
    http:
      url: http://152.44.254.110/os/Ubuntu_Server_-_24.04.5.raw 
  storage:
    storageClassName: rook-ceph-images
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 12Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-data
  namespace: vms
spec:
  storageClassName: truenas-nvmeof
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: norwood-test
  namespace: vms
spec:
  running: false
  template:
    metadata:
      labels:
        kubevirt.io/domain: norwood
      annotations:
        ovn.kubernetes.io/ip_address: 172.16.16.222 
        ovn.kubernetes.io/mac_address: 00:00:00:53:6B:B6 
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: datadisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              bridge: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: test-rootdisk
        - name: datadisk
          persistentVolumeClaim:
            claimName: test-data
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              users:
                - name: norwood
                  groups: wheel
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
              chpasswd:
                list: |
                  norwood:testpassword
                expire: false
              ssh_pwauth: true
