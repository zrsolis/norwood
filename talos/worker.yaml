apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445 # KubePrism port.
---
apiVersion: v1alpha1
kind: BondConfig
name: Bond0 # Name of the bond link (interface) to be created.
# Names of the links (interfaces) on which the bond will be created.
links:
    - ens33f0np0
    - ens33f1np1
bondMode: 802.3ad # Bond mode.
miimon: 100 # Link monitoring frequency in milliseconds.
updelay: 5000 # The time, in milliseconds, to wait before enabling a slave after a link recovery has been detected.
downdelay: 2000 # The time, in milliseconds, to wait before disabling a slave after a link failure has been detected.
xmitHashPolicy: layer3+4 # Selects the transmit hash policy to use for slave selection.
lacpRate: fast # LACPDU frames periodic transmission rate.
resendIGMP: 1 # The number of times IGMP packets should be resent.
up: true # Bring the link up or down.

# # Override the hardware (MAC) address of the link.
# hardwareAddr: 2e:3c:4d:5e:6f:70

# # ARP link monitoring frequency in milliseconds.
# arpInterval: 1000

# # The list of IPv4 addresses to use for ARP link monitoring when arpInterval is set.
# arpIpTargets:
#     - 10.15.0.1

# # The list of IPv6 addresses to use for NS link monitoring when arpInterval is set.
# nsIp6Targets:
#     - fd00::1

# # Specifies whether or not ARP probes and replies should be validated.
# arpValidate: active

# # Specifies whether ARP probes should be sent to any or all targets.
# arpAllTargets: all

# # Specifies whether active-backup mode should set all slaves to the same MAC address
# failOverMac: active

# # Aggregate selection policy for 802.3ad.
# adSelect: stable

# # Actor system priority for 802.3ad.
# adActorSysPrio: 65535

# # Whether to send LACPDU frames periodically, defaults to "on" if mode is 802.3ad.
# adLACPActive: on

# # Policy under which the primary slave should be reselected.
# primaryReselect: always

# # Whether dynamic shuffling of flows is enabled in tlb or alb mode.
# tlbLogicalLb: 1
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: enp3s0f0np0 # Name of the link (interface).

# # Raw value of the DUID to use as client identifier.
# duidRaw: 00:01:00:01:23:45:67:89:ab:cd:ef:01:23:45
---
apiVersion: v1alpha1
kind: LinkConfig
name: eno1np0 # Name of the link (interface).
up: true # Bring the link up or down.
# Configure addresses to be statically assigned to the link.
addresses:
    - address: 172.16.12.101/24 # IP address to be assigned to the link.
    - address: 172.16.12.195/24 # IP address to be assigned to the link.
    - address: 172.16.12.117/24 # IP address to be assigned to the link.
# Configure routes to be statically created via the link.
routes:
    - gateway: 172.16.12.1 # The route's gateway (if empty, creates link scope route).
      
      # # The route's destination as an address prefix.
      # destination: 10.0.0.0/8
    - gateway: 172.16.12.1 # The route's gateway (if empty, creates link scope route).
      
      # # The route's destination as an address prefix.
      # destination: 10.0.0.0/8
    - gateway: 172.16.12.1 # The route's gateway (if empty, creates link scope route).
      
      # # The route's destination as an address prefix.
      # destination: 10.0.0.0/8
---
apiVersion: v1alpha1
kind: LinkConfig
name: ens1f1np1 # Name of the link (interface).
up: true # Bring the link up or down.
mtu: 9000 # Configure LinkMTU (Maximum Transmission Unit) for the link.
# Configure addresses to be statically assigned to the link.
addresses:
    - address: 172.16.13.1/27 # IP address to be assigned to the link.
    - address: 172.16.13.2/27 # IP address to be assigned to the link.
    - address: 172.16.13.3/27 # IP address to be assigned to the link.
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: lldpd # Name of the extension service.
# The config files for the extension service.
configFiles:
    - content: | # The content of the extension service config file.
        configure lldp portidsubtype ifname
        unconfigure lldp management-addresses-advertisements
        unconfigure lldp capabilities-advertisements
        configure system description "Talos Node"
      mountPath: /usr/local/etc/lldpd/lldpd.conf # The mount path of the extension service config file.
