machine:
  network:
    interfaces:
      - interface: ens1f0np0
        ignore: true
      - interface: ens1f1np1
        ignore: true
  kernel:
  - modules:
    - name: vfio
    - name: vfio_iommu_type1
    - name: vfio_pci
    - name: vfio_virqfd
  install:
    extraKernelArgs:
      - amd_iommu=on
      - iommu=pt
      - hugepagesz=1G
      - hugepages=96
      - default_hugepagesz=1G
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme1n1"
  wipe: true
