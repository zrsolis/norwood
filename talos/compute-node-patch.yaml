machine:
  network:
    interfaces:
      - interface: ens33f0np0
        ignore: true
      - interface: ens33f1np1
        ignore: true
  kernel:
    modules:
    - name: vfio
    - name: vfio_iommu_type1
    - name: vfio_pci
      parameters: 
      - ids=10de:27b2,10de:22bc,10de:2c34,10de:22e9
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/69acd9d184a0eadb37753908c9aabce8edca6fcc6dcce2a4103b3bd430133c98:v1.14.5
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme0n1"
  wipe: true