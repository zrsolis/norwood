apiVersion: v1alpha1
kind: HostnameConfig
hostname: k8s-node1
---
apiVersion: v1alpha1
kind: LinkConfig
name: eno1np0
up: true
addresses:
  - address: 172.16.12.101/24
routes:
  - gateway: 172.16.12.1 
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
    - ens1f0np0
    - ens1f1np1
bondMode: 802.3ad
miimon: 100
updelay: 5000
downdelay: 2000
xmitHashPolicy: layer3+4
lacpRate: fast
resendIGMP: 1
up: true
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.501
vlanID: 501
vlanMode: 802.1q
parent: bond0
up: true
addresses:
  - address: 172.16.13.1/27
