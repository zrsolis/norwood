# Disabling ovsOvn config as not necessary for non-Talos
#ovsOvn:
#  ovnDirectory: /var/lib/ovn
#  ovsDirectory: /var/lib/openvswitch
#  ovsIpsecKeysDirectory: "/var/lib/ovs_ipsec_keys"
#  disableModulesManagement: true
networking:
  networkType: vlan 
  excludeIps: "172.16.16.1..172.16.16.24"
  stack: "IPv4"
  vlan: 
    interfaceName: bond0
    id: 0
  pods:
    cidr:
      v4: "172.16.16.0/24"
    gateways:
      v4: "172.16.16.1"
# Disabling cni config as not necessary for non-Talos
#cni: 
#  mountToolingDirectory: false
features:
  enableNetworkPolicies: false
